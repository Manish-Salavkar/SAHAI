# docker-compose.yml
version: '3.8'

services:
  backend:
    build: ./backend
    container_name: sahai_backend
    env_file:
      - ./backend/app/.env
    ports:
      - "8002:8002"
    volumes:
      - ./backend:/app
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY}
    container_name: sahai_frontend
    ports:
      - "8000:80"
    depends_on:
      - backend
    restart: unless-stopped